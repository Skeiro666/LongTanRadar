# News Intelligence Engine — 多源，失败降级，不去绑定单一网站
news_version: news_v1
event_engine_version: event_extract_v1
provider_version: multi_v1

# 可增删：baidu / eastmoney / sina / ths
providers:
  - baidu
  - eastmoney
  - sina

fetch:
  stock_limit: 20
  timeout_sec: 12
  latest_limit: 40
  # Stock→News: drop items with no name/code hit in title/body (query_weak)
  min_link_confidence: 0.5
  # 个股新闻：标题必须含公司名或代码；正文命中（body_only）会被丢弃
  stock_news_title_required: true

# Parallel discovery (News → events). Does not emit BUY. Union is Phase 3.
discovery:
  enabled: true
  providers:
    - sina
    - ths
  max_news_candidates: 100
  min_code_confidence: 0.82
  industry_map_available: false
  # 规则映射失败时，用本地 LLM（NEWS_AI_*）推断受益股；置信度硬顶 0.45
  # 可由 .env NEWS_AI_LLM_MAPPING 覆盖
  llm_mapping: true
  max_llm_mapping_per_cycle: 8
  # 简称 → 代码；不含歧义词（如单独「平安」）
  aliases:
    茅台: 600519.SH

# 本地新闻智能引擎 LLM（.env 的 NEWS_AI_* 覆盖此处）
llm:
  provider: local
  base_url: http://127.0.0.1:11434/v1
  model: qwen3.5:latest
  api_key_env: NEWS_AI_API_KEY
  temperature: 0.1
  timeout_sec: 45
  max_tokens: 768
  extra_body:
    think: false
    reasoning_effort: none

# Local News Intelligence (Task B). Never calls Council.
intelligence:
  enabled: true
  prompt_version: news_intel_v1
  max_concurrency: 2
  max_retries: 0
  max_llm_per_cycle: 12
  max_tokens_per_cycle: 80000
  max_timeouts_before_skip: 2
  timeout_sec: 45
  score_weights:
    importance: 0.22
    novelty: 0.18
    market_relevance: 0.22
    event_confidence: 0.16
    entity_confidence: 0.12
    source_quality: 0.10

windows_hours:
  last_24h: 24
  last_3d: 72
  last_7d: 168
  last_30d: 720

candidate_weights:
  leader: 0.35
  profit_inflection: 0.25
  event: 0.15
  news: 0.15
  ml: 0.10

source_quality:
  exchange_or_company: A
  official_gov: A
  major_media: B
  aggregator: C
  unknown: D
