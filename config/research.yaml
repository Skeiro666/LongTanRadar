# Research platform config
research_version: research_v1
enabled: true

funnel:
  max_after_screen: 500
  max_after_events: 100
  max_union_candidates: 100
  max_research_pool: 20
  max_council: 12

ml_ranking:
  enabled: true
  horizon_days: 5
  weight_in_candidate_score: 0.10
  leader_weight: 0.40
  factor_weight: 0.25

council:
  mode: multi_model
  max_debate_rounds: 2
  parallel_roles: true
  # Research rating ≠ trading action
  separate_trading_action: true
  roles:
    - id: fundamental
      name: Fundamental Analyst
      prompt_version: fundamental_v1
    - id: quant
      name: Quant Analyst
      prompt_version: quant_v1
    - id: event
      name: Event Analyst
      prompt_version: event_v1
    - id: valuation
      name: Valuation Analyst
      prompt_version: valuation_v1
    - id: bear
      name: Bear Analyst
      prompt_version: bear_v1
    - id: chair
      name: Chairman
      prompt_version: chairman_v1

context_compression:
  enabled: true
  max_news_headlines: 5
  max_timeline_events: 6
  max_hypotheses: 8

research_cache:
  enabled: true
  dir: data/cache/research
  ttl_hours: 24

dynamic_council:
  enabled: true
  min_profit_score: 0.2
  min_leader_score: 0.15
  min_ml_prediction: 0.005
  min_event_score: 0.1

research_gate:
  enabled: true
  always_pass_top_n: 3
  deep_threshold: 0.22
  light_threshold: 0.12
  max_deep: 10
  max_light: 8
  max_llm_calls: 30
  min_candidate_score: 0.12
  min_leader_score: 0.10
  min_ml_prediction: 0.003
  min_profit_score: 0.15
  min_event_score: 0.08
  min_news_score: 0.12
  boost_sources: [news, profit, event]
  boost_score_floor: 0.08

incremental_research:
  enabled: true

decision:
  canonical_source: platform_council
  roundtable_controls_trading: false

tracking:
  horizons_days: [1, 3, 5, 10, 20, 60]
  attribution_horizon: 5
  benchmark: csi300
  benchmark_fallback: equal_weight_universe
  execution_tracking: true

snapshot:
  factor_version: factor_v1
  prompt_bundle: prompts_v1
  model_bundle: models_v1

ab_test:
  quant_only_key: quant_only
  quant_ai_key: quant_plus_ai

role_ablation:
  enabled: true
  top_k: 5

model_benchmark:
  enabled: true

llm_budget:
  enabled: true
  max_llm_calls: 30
  max_input_tokens: 800000
  max_output_tokens: 200000
  max_cost_usd: 5.0

attribution:
  primary_source_priority: [profit, event, quant, news, ml]
  horizons_days: [1, 5, 10, 20]
  minimum_sample: 5
  minimum_sample_size: 30

ai_routing:
  enabled: true
  low_conflict_max: 0.25
  high_conflict_min: 0.55
  low_score_skip_above: 0.72
  low_score_skip_below: 0.18

cloud_escalation:
  enabled: true
  importance_threshold: 0.75
  low_event_confidence: 0.45
  conflict_threshold: 0.55
  candidate_score_threshold: 0.35
  min_triggers: 2

news_calibration:
  minimum_sample: 5
  news_score_threshold: 0.12
  quant_score_threshold: 0.15

candidate_score:
  semantic: cross_sectional_ranking_score
  not_probability: true
  not_expected_return: true
