[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare"
version = "0.1.0"
description = "寻龙尺 (XunLongChi): A-share leader & event discovery, research council, paper trading"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0.1",
  "python-dotenv>=1.0.1",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "pyarrow>=15.0.0",
  "akshare>=1.14.0",
  "httpx>=0.27.0",
  "openai>=1.40.0",
  "lightgbm>=4.3.0",
  "scikit-learn>=1.4.0",
  "joblib>=1.3.0",
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "sqlalchemy>=2.0.0",
  "psycopg[binary]>=3.1.0",
  "redis>=5.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
ashare = "ashare.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
